[project]
name = "file-processor"
version = "0.1.0"
description = "文件批量处理工具 - 批量重命名、转换、整理"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
file-processor = "processor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["processor"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
